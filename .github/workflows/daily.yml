name: Daily collection

on:
  schedule:
    - cron: "0 21 * * *" # 06:00 JST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect new breach reports
        run: npm run collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_REPORT: ${{ runner.temp }}/run-report.md
      - name: Save logos for new organizations
        run: npm run logos
      - name: Check data and site still build
        run: |
          npm run validate
          npm test
          npm run build
      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: collect/daily
          delete-branch: true
          commit-message: "Daily breach collection"
          title: "Daily breach collection"
          body-path: ${{ runner.temp }}/run-report.md
          add-paths: |
            data/
            public/logos/
